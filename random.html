
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoe Colourway Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f2f3f5;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    width: 100%;
    max-width: 1500px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 18px;
}

header h1 {
    margin: 0 0 6px;
    font-size: 25px;
}

header p {
    margin: 0;
    color: #777;
    font-size: 12px;
}

.top-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.top-link {
    display: inline-block;
    padding: 9px 14px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
}

.top-link:hover {
    background: #444;
}

.workspace {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.preview-panel {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.canvas-container {
    width: fit-content;
    max-width: 100%;
    overflow: hidden;
    border-radius: 6px;
}

canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 681px;
    margin: 0 auto;
}

.preview-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    gap: 8px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 6px;
    padding: 9px 13px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    opacity: .82;
}

.generate-btn {
    background: #171717;
    color: white;
    padding: 11px 17px;
    font-size: 12px;
}

.download-btn {
    background: #e8e8e8;
    color: #222;
}

.reset-all-btn {
    background: #eee;
    color: #333;
}

.design-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 9px 10px;
    background: #f7f7f7;
    border-radius: 6px;
}

.design-name {
    font-size: 11px;
    font-weight: 700;
}

.design-count {
    font-size: 10px;
    color: #888;
}

.status {
    font-size: 10px;
    color: #888;
    margin-top: 8px;
}

.controls-heading {
    font-size: 14px;
    font-weight: 700;
    margin: 8px 0 0;
}

.controls-subheading {
    font-size: 11px;
    color: #888;
    margin-top: -7px;
}

.controls-panel {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
    width: 100%;
}

.component-card {
    background: white;
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    min-width: 0;
}

.component-header {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 7px;
}

.component-title {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: #777;
    cursor: pointer;
}

.toggle input {
    accent-color: #222;
    margin: 0;
}

.control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 3px;
    margin-bottom: 3px;
}

.control-row label,
.opacity-value {
    font-size: 10px;
    color: #777;
}

.color-control {
    width: 30px;
    height: 24px;
    padding: 1px;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    background: white;
}

input[type="range"] {
    width: 100%;
    accent-color: #222;
    margin: 2px 0 7px;
    cursor: pointer;
}

select {
    width: 100%;
    padding: 5px 3px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: white;
    font-size: 10px;
    margin-bottom: 6px;
}

.gradient-controls {
    display: none;
}

.gradient-controls.visible {
    display: block;
}

.gradient-direction-label {
    display: block;
    font-size: 10px;
    color: #777;
    margin-bottom: 3px;
}

.reset-btn {
    background: #f1f1f1;
    color: #555;
    padding: 5px 7px;
    font-size: 9px;
    width: 100%;
}

.card-footer {
    display: flex;
    justify-content: stretch;
}

@media (max-width: 850px) {
    .controls-panel {
        display: flex;
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-snap-type: x proximity;
    }

    .component-card {
        flex: 0 0 145px;
        scroll-snap-align: start;
    }
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    header h1 {
        font-size: 20px;
    }

    .component-card {
        flex-basis: 135px;
    }

    .preview-actions button {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Shoe Colourway Generator</h1>
    <p>Explore new colour combinations while keeping the original shoe exactly as it is.</p>
</header>

<div class="top-links">
    <a href="index.html" class="top-link">Manual Designer</a>
    <a href="adizero_feather/index.html" target="_blank" class="top-link">Shoe History</a>
</div>

<div class="workspace">

    <section class="preview-panel">

        <div class="canvas-container">
            <canvas id="shoeCanvas"></canvas>
        </div>

        <div class="preview-actions">
            <button class="reset-all-btn" onclick="resetAll()">
                Reset all
            </button>

            <button class="generate-btn" onclick="generateDesign()">
                Generate new design
            </button>

            <button class="download-btn" onclick="downloadImage()">
                Download PNG
            </button>
        </div>

        <div class="design-info">
            <span class="design-name" id="designName">Original shoe</span>
            <span class="design-count" id="designCount">Designs generated: 0</span>
        </div>

        <div class="status" id="status">
            Loading shoe images...
        </div>

    </section>

    <div class="controls-heading">
        Shoe Components
    </div>

    <div class="controls-subheading">
        You can fine-tune any generated design using the controls below.
    </div>

    <aside class="controls-panel" id="controlsPanel"></aside>

</div>
</div>

<script>

const canvas = document.getElementById("shoeCanvas");
const ctx = canvas.getContext("2d");

const originalImage = new Image();

/* COMPONENT SETTINGS */

const components = [
    {
        id: "sole",
        name: "Sole",
        file: "sole.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "laces",
        name: "Laces",
        file: "laces.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "small_parts",
        name: "Small Parts",
        file: "small_parts.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "stripes",
        name: "Stripes",
        file: "stripes.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "upper",
        name: "Upper",
        file: "upper.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "main_part",
        name: "Main Part",
        file: "main_part.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    },
    {
        id: "carbon_plate",
        name: "Carbon Plate",
        file: "carbon_plate.png",
        color: "#e84b18",
        color2: "#1e90ff",
        colorMode: "solid",
        direction: "horizontal",
        opacity: 70,
        blend: "color",
        enabled: false
    }
];

const images = {};

let generatedCount = 0;
let previousPalette = "";

/* CURATED RUNNING-SHOE COLOUR PALETTES */

const palettes = [
    {
        name: "Solar Red",
        primary: "#F0EDE5",
        secondary: "#D8D7D1",
        accent: "#E34B43",

    },
    {

        light: "#F5F5F0",
        pop: "#E86B4A"
    },
    {
        name: "Electric Lime",
        primary: "#C9D84A",
        secondary: "#E4E8C9",
        accent: "#A7C52D",
        dark: "#292D2B",
        light: "#F4F3E9",
        pop: "#E9F16B"
    },
    {
        name: "Core Black",
        primary: "#303236",
        secondary: "#55585D",
        accent: "#E5E2D9",
        dark: "#17191C",
        light: "#F1F0EA",
        pop: "#D8D9D7"
    },
    {
        name: "Silver Flash",
        primary: "#BFC4C8",
        secondary: "#E0E2E1",
        accent: "#555F6B",
        dark: "#30343A",
        light: "#F5F5F2",
        pop: "#8FA9BA"
    },
    {
        name: "Solar Orange",
        primary: "#E5A15B",
        secondary: "#F0D5B3",
        accent: "#E66B35",
        dark: "#34302C",
        light: "#F7F0E4",
        pop: "#F2C34D"
    },
    {
        name: "Blue Racer",
        primary: "#286BA5",
        secondary: "#A9C9DF",
        accent: "#E8E9E5",
        dark: "#202B3A",
        light: "#F5F4ED",
        pop: "#E65D48"
    },
    {
        name: "White and Volt",
        primary: "#F0F0E9",
        secondary: "#D7DAD1",
        accent: "#C5D92E",
        dark: "#343936",
        light: "#FFFFFF",
        pop: "#E5EE54"
    },
    {
        name: "Warm Sand",
        primary: "#D6C3A5",
        secondary: "#E8DCC8",
        accent: "#A66D4C",
        dark: "#403A34",
        light: "#F4EDE0",
        pop: "#B8A16C"
    },
    {
        name: "Purple Pulse",
        primary: "#76678F",
        secondary: "#B8A9C9",
        accent: "#E3DCEB",
        dark: "#302B3B",
        light: "#F4F0F5",
        pop: "#D36C8A"
    },
    {
        name: "Mint Energy",
        primary: "#A7CFC3",
        secondary: "#D7E7DF",
        accent: "#438D80",
        dark: "#303D3A",
        light: "#F4F5EE",
        pop: "#E6A45E"
    },
    {
        name: "Redline",
        primary: "#C83E42",
        secondary: "#E7B7B2",
        accent: "#F0EDE5",
        dark: "#29282B",
        light: "#F8F5EF",
        pop: "#E77A3C"
    }
];

/* BLEND MODES */

const blendModes = [
    ["color", "Color"],
    ["multiply", "Multiply"],
    ["overlay", "Overlay"],
    ["soft-light", "Soft Light"],
    ["hard-light", "Hard Light"],
    ["screen", "Screen"],
    ["darken", "Darken"],
    ["lighten", "Lighten"],
    ["color-burn", "Color Burn"],
    ["color-dodge", "Color Dodge"],
    ["normal", "Normal"]
];

/* GRADIENT DIRECTIONS */

const gradientDirections = [
    ["horizontal", "Horizontal"],
    ["vertical", "Vertical"],
    ["diagonal-down", "Diagonal Down"],
    ["diagonal-up", "Diagonal Up"]
];

/* CREATE CONTROLS */

function createControls() {

    const panel = document.getElementById("controlsPanel");

    components.forEach(component => {

        const card = document.createElement("div");
        card.className = "component-card";

        const blendOptions = blendModes.map(mode => `
            <option value="${mode[0]}">
                ${mode[1]}
            </option>
        `).join("");

        const directionOptions = gradientDirections.map(direction => `
            <option value="${direction[0]}">
                ${direction[1]}
            </option>
        `).join("");

        card.innerHTML = `

            <div class="component-header">

                <span class="component-title">
                    ${component.name}
                </span>

                <label class="toggle">
                    <input
                        type="checkbox"
                        id="${component.id}_enabled"
                        onchange="toggleComponent('${component.id}', this.checked)"
                    >
                    Show
                </label>

            </div>

            <select
                id="${component.id}_color_mode"
                onchange="changeColorMode('${component.id}', this.value)"
            >
                <option value="solid">Solid Color</option>
                <option value="gradient">Gradient</option>
            </select>

            <div class="control-row">
                <label>Color 1</label>
                <input
                    class="color-control"
                    type="color"
                    id="${component.id}_color"
                    value="${component.color}"
                    oninput="changeColor('${component.id}', this.value)"
                >
            </div>

            <div class="gradient-controls" id="${component.id}_gradient_controls">

                <div class="control-row">
                    <label>Color 2</label>
                    <input
                        class="color-control"
                        type="color"
                        id="${component.id}_color2"
                        value="${component.color2}"
                        oninput="changeColor2('${component.id}', this.value)"
                    >
                </div>

                <label class="gradient-direction-label">
                    Gradient direction
                </label>

                <select
                    id="${component.id}_direction"
                    onchange="changeDirection('${component.id}', this.value)"
                >
                    ${directionOptions}
                </select>

            </div>

            <div class="control-row">
                <label>Opacity</label>
                <span class="opacity-value" id="${component.id}_opacity_value">
                    70%
                </span>
            </div>

            <input
                type="range"
                id="${component.id}_opacity"
                min="0"
                max="100"
                value="${component.opacity}"
                oninput="changeOpacity('${component.id}', this.value)"
            >

            <select
                id="${component.id}_blend"
                onchange="changeBlend('${component.id}', this.value)"
            >
                ${blendOptions}
            </select>

            <div class="card-footer">
                <button
                    class="reset-btn"
                    onclick="resetComponent('${component.id}')"
                >
                    Reset
                </button>
            </div>
        `;

        panel.appendChild(card);

    });

}

/* LOAD IMAGES */

function loadImages() {

    const totalImages = components.length + 1;
    let imagesLoaded = 0;
    let hasError = false;

    function imageLoaded() {

        imagesLoaded++;

        if (imagesLoaded === totalImages && !hasError) {

            canvas.width = originalImage.naturalWidth;
            canvas.height = originalImage.naturalHeight;

            document.getElementById("status").textContent =
                `Ready - Original resolution: ${canvas.width} × ${canvas.height} px`;

            renderShoe();

        }

    }

    originalImage.onload = imageLoaded;

    originalImage.onerror = function() {
        hasError = true;
        document.getElementById("status").textContent =
            "Error loading shoe_original.jpg. Check filename.";
    };

    components.forEach(component => {

        const img = new Image();

        img.onload = imageLoaded;

        img.onerror = function() {
            hasError = true;
            document.getElementById("status").textContent =
                "Could not load " + component.file +
                ". Check that the PNG exists in the same folder.";
        };

        img.src = component.file;
        images[component.id] = img;

    });

    originalImage.src = "shoe_original.jpg";
}

/* GET COMPONENT */

function getComponent(id) {
    return components.find(c => c.id === id);
}

/* COMPONENT CONTROLS */

function toggleComponent(id, enabled) {
    getComponent(id).enabled = enabled;
    renderShoe();
}

function changeColor(id, color) {
    getComponent(id).color = color;
    renderShoe();
}

function changeColor2(id, color) {
    getComponent(id).color2 = color;
    renderShoe();
}

function changeColorMode(id, mode) {

    const component = getComponent(id);
    component.colorMode = mode;

    document.getElementById(
        id + "_gradient_controls"
    ).classList.toggle("visible", mode === "gradient");

    renderShoe();
}

function changeDirection(id, direction) {
    getComponent(id).direction = direction;
    renderShoe();
}

function changeOpacity(id, opacity) {

    getComponent(id).opacity = Number(opacity);

    document.getElementById(id + "_opacity_value").textContent =
        opacity + "%";

    renderShoe();
}

function changeBlend(id, blend) {
    getComponent(id).blend = blend;
    renderShoe();
}

/* UPDATE CONTROLS AFTER GENERATION */

function updateControls(component) {

    document.getElementById(component.id + "_enabled").checked =
        component.enabled;

    document.getElementById(component.id + "_color").value =
        component.color;

    document.getElementById(component.id + "_color2").value =
        component.color2;

    document.getElementById(component.id + "_color_mode").value =
        component.colorMode;

    document.getElementById(component.id + "_direction").value =
        component.direction;

    document.getElementById(component.id + "_opacity").value =
        component.opacity;

    document.getElementById(component.id + "_opacity_value").textContent =
        component.opacity + "%";

    document.getElementById(component.id + "_blend").value =
        component.blend;

    document.getElementById(
        component.id + "_gradient_controls"
    ).classList.toggle(
        "visible",
        component.colorMode === "gradient"
    );
}

/* RANDOM HELPERS */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* GENERATE A NEW COLOURWAY */

function generateDesign() {

    if (!originalImage.complete || !originalImage.naturalWidth) {
        document.getElementById("status").textContent =
            "Please wait until the shoe images have loaded.";
        return;
    }

    let palette;

    do {
        palette = randomItem(palettes);
    } while (palette.name === previousPalette && palettes.length > 1);

    previousPalette = palette.name;

    /*
       Each component receives a colour role.
       The original PNG masks and shoe image are never changed.
    */

    const componentDesigns = {

        main_part: {
            colors: [palette.primary, palette.secondary, palette.light],
            gradientChance: 0.45
        },

        upper: {
            colors: [palette.secondary, palette.primary, palette.light],
            gradientChance: 0.40
        },

        sole: {
            colors: [palette.light, palette.dark, palette.secondary],
            gradientChance: 0.25
        },

        laces: {
            colors: [palette.accent, palette.light, palette.primary],
            gradientChance: 0.20
        },

        small_parts: {
            colors: [palette.accent, palette.pop, palette.dark],
            gradientChance: 0.35
        },

        stripes: {
            colors: [palette.accent, palette.pop, palette.light],
            gradientChance: 0.35
        },

        carbon_plate: {
            colors: [palette.dark, palette.secondary, palette.accent],
            gradientChance: 0.20
        }

    };

    components.forEach(component => {

        const design = componentDesigns[component.id];

        const selectedColors = [...design.colors];

        component.color = randomItem(selectedColors);

        // Choose a different second colour for gradients.
        const possibleSecondColors = selectedColors.filter(
            color => color !== component.color
        );

        component.color2 = randomItem(possibleSecondColors);

        component.colorMode =
            Math.random() < design.gradientChance
                ? "gradient"
                : "solid";

        component.direction = randomItem([
            "horizontal",
            "vertical",
            "diagonal-down",
            "diagonal-up"
        ]);

        component.opacity = randomNumber(78, 100);

        component.blend = "color";

        // Keep the main shoe areas visible.
        if (component.id === "main_part" || component.id === "upper") {
            component.enabled = true;
        } else {
            component.enabled = Math.random() < 0.85;
        }

        // Occasionally use multiply for darker sole and carbon details.
        if (
            (component.id === "sole" || component.id === "carbon_plate") &&
            Math.random() < 0.18
        ) {
            component.blend = "multiply";
        }

        updateControls(component);

    });

    generatedCount++;

    document.getElementById("designName").textContent =
        "Colourway: " + palette.name;

    document.getElementById("designCount").textContent =
        "Designs generated: " + generatedCount;

    document.getElementById("status").textContent =
        "New colourway generated. Try another combination or fine-tune the details below.";

    renderShoe();

}

/* RESET COMPONENT */

function resetComponent(id) {

    const component = getComponent(id);

    component.color = "#e84b18";
    component.color2 = "#1e90ff";
    component.colorMode = "solid";
    component.direction = "horizontal";
    component.opacity = 70;
    component.blend = "color";
    component.enabled = false;

    updateControls(component);
    renderShoe();
}

/* RESET ALL */

function resetAll() {

    components.forEach(component => {

        component.color = "#e84b18";
        component.color2 = "#1e90ff";
        component.colorMode = "solid";
        component.direction = "horizontal";
        component.opacity = 70;
        component.blend = "color";
        component.enabled = false;

        updateControls(component);

    });

    document.getElementById("designName").textContent =
        "Original shoe";

    document.getElementById("status").textContent =
        "All colour changes have been reset.";

    renderShoe();
}

/* CREATE GRADIENT */

function createComponentGradient(component, tempCtx) {

    const width = canvas.width;
    const height = canvas.height;

    let gradient;

    switch (component.direction) {

        case "vertical":
            gradient = tempCtx.createLinearGradient(0, 0, 0, height);
            break;

        case "diagonal-down":
            gradient = tempCtx.createLinearGradient(0, 0, width, height);
            break;

        case "diagonal-up":
            gradient = tempCtx.createLinearGradient(0, height, width, 0);
            break;

        case "horizontal":
        default:
            gradient = tempCtx.createLinearGradient(0, 0, width, 0);
            break;
    }

    gradient.addColorStop(0, component.color);
    gradient.addColorStop(1, component.color2);

    return gradient;
}

/* CREATE COLOURED LAYER */

function createColoredLayer(component) {

    const img = images[component.id];

    const tempCanvas = document.createElement("canvas");

    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;

    const tempCtx = tempCanvas.getContext("2d");

    tempCtx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );

    tempCtx.globalCompositeOperation = "source-in";

    if (component.colorMode === "gradient") {

        tempCtx.fillStyle = createComponentGradient(
            component,
            tempCtx
        );

    } else {

        tempCtx.fillStyle = component.color;

    }

    tempCtx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    tempCtx.globalCompositeOperation = "source-over";

    return tempCanvas;
}

/* RENDER SHOE - ORIGINAL FIXED LAYER ORDER */

function renderShoe() {

    if (!originalImage.complete || !originalImage.naturalWidth) {
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    // Original shoe is always drawn first.
    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Keep the same layer order as the manual configurator.
    const layerOrder = [
        "sole",
        "laces",
        "small_parts",
        "upper",
        "main_part",
        "stripes",
        "carbon_plate"
    ];

    layerOrder.forEach(id => {

        const component = getComponent(id);

        if (!component || !component.enabled || component.opacity <= 0) {
            return;
        }

        const img = images[component.id];

        if (!img || !img.complete || !img.naturalWidth) {
            return;
        }

        const coloredLayer = createColoredLayer(component);

        ctx.globalAlpha = component.opacity / 100;

        ctx.globalCompositeOperation =
            component.blend === "normal"
                ? "source-over"
                : component.blend;

        ctx.drawImage(coloredLayer, 0, 0);

    });

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
}

/* DOWNLOAD FULL RESOLUTION PNG */

function downloadImage() {

    renderShoe();

    const link = document.createElement("a");

    link.download = "shoe_colourway_" + generatedCount + ".png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}

/* INITIALIZE */

createControls();
loadImages();

</script>
