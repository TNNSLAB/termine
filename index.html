
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05090d">

<title>Kommende Theaterstücke</title>

<style>
:root {
  color-scheme: dark;
  --bg: #05090d;
  --panel: #0a1119;
  --line: #233244;
  --muted: #8ca2ba;
  --text: #f1f6fc;
  --green: #00c781;
  --amber: #ffbf2f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
    Consolas, "Liberation Mono", monospace;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: clamp(18px, 4vw, 44px);
}

header {
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
  margin-bottom: 24px;
}

.brand {
  font-size: clamp(25px, 4vw, 40px);
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1.2;
}

.subtitle {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .12em;
}

.table-head,
.event {
  display: grid;
  grid-template-columns: 1.15fr 1.6fr .7fr .8fr;
  gap: 18px;
  align-items: center;
}

.table-head {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .1em;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.event {
  padding: 22px 14px;
  border-bottom: 1px solid var(--line);
}

.date {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
}

.small {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.title {
  font-size: 16px;
  font-weight: 750;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.sold {
  font-size: 25px;
  font-weight: 800;
}

.status {
  display: inline-block;
  border: 1px solid var(--green);
  color: var(--green);
  padding: 6px 9px;
  font-size: 11px;
  letter-spacing: .04em;
  white-space: nowrap;
}

.status.warning {
  color: var(--amber);
  border-color: var(--amber);
}

.bar {
  width: 100%;
  height: 5px;
  margin-top: 10px;
  background: var(--line);
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--green);
}

.bar span.warning {
  background: var(--amber);
}

.empty,
.error {
  color: var(--muted);
  padding: 28px 14px;
  border-bottom: 1px solid var(--line);
  line-height: 1.7;
}

.error {
  color: var(--amber);
}

@media (max-width: 650px) {
  .table-head {
    display: none;
  }

  .event {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    padding: 20px 4px;
  }

  .dateblock {
    grid-column: 1;
  }

  .eventname {
    grid-column: 1;
  }

  .sales {
    grid-column: 2;
    grid-row: 1 / span 2;
    text-align: right;
    min-width: 90px;
  }

  .statusblock {
    grid-column: 1 / -1;
  }

  .bar {
    max-width: 260px;
  }
}
</style>
</head>

<body>
<main>

  <header>
    <div class="brand">TICKETS</div>
    <div class="subtitle">Henrik - Hacker</div>
  </header>

  <div class="table-head">
    <div>DATUM / UHRZEIT</div>
    <div>VERANSTALTUNG</div>
    <div>VERKAUFT</div>
    <div>STATUS</div>
  </div>

  <section id="events" aria-live="polite">
    <div class="empty">Vorstellungen werden geladen …</div>
  </section>

</main>

<script>
"use strict";

const DATA_URL =
  "https://raw.githubusercontent.com/TNNSLAB/termine/main/state.json";

const REFRESH_MS = 5 * 60 * 1000;

// Tatsächliche Kapazität pro Vorstellung eintragen.
const CAPACITY = 150;

const $ = id => document.getElementById(id);

let isLoading = false;

const MONTHS = {
  jan: 0,
  januar: 0,
  feb: 1,
  februar: 1,
  mär: 2,
  märz: 2,
  mrz: 2,
  apr: 3,
  april: 3,
  mai: 4,
  jun: 5,
  juni: 5,
  jul: 6,
  juli: 6,
  aug: 7,
  august: 7,
  sep: 8,
  sept: 8,
  september: 8,
  okt: 9,
  oktober: 9,
  nov: 10,
  november: 10,
  dez: 11,
  dezember: 11
};

function parseEvent(key, sold) {
  // Erwartetes Format:
  // 123456-Napoleons Spion Sa., 24. Okt. 2026 20:00 Uhr

  const idMatch = key.match(/^(\d+)-(.+)$/);
  const id = idMatch ? idMatch[1] : "";
  const rawTitle = idMatch ? idMatch[2] : key;

  const pattern =
    /^(.*?)\s+(?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*(\d{1,2})\.\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*Uhr$/i;

  const match = rawTitle.trim().match(pattern);

  let title = rawTitle;
  let dateLabel = "";
  let timeLabel = "";
  let dateValue = null;

  if (match) {
    title = match[1].trim();

    const day = Number(match[2]);
    const monthName = match[3]
      .replace(/\.$/, "")
      .toLocaleLowerCase("de-DE");

    const year = Number(match[4]);
    const hours = Number(match[5]);
    const minutes = Number(match[6]);

    const month = MONTHS[monthName];

    const labelMatch = rawTitle.match(
      /((?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*\d{1,2}\.\s+[A-Za-zÄÖÜäöü]+\.?\s+\d{4})/i
    );

    if (labelMatch) {
      dateLabel = labelMatch[1].trim();
    }

    timeLabel =
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0");

    if (
      month !== undefined &&
      day >= 1 && day <= 31 &&
      hours >= 0 && hours <= 23 &&
      minutes >= 0 && minutes <= 59
    ) {
      const parsed = new Date(
        year, month, day, hours, minutes
      );

      // Ungültige Kalenderdaten nicht übernehmen.
      if (
        parsed.getFullYear() === year &&
        parsed.getMonth() === month &&
        parsed.getDate() === day
      ) {
        dateValue = parsed;
      }
    }
  }

  const soldNumber = Number(sold);

  return {
    id,
    title,
    dateLabel,
    timeLabel,
    dateValue,
    sold: Number.isFinite(soldNumber)
      ? Math.max(0, soldNumber)
      : 0
  };
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function render(data) {
  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {
    throw new Error("Ungültiges JSON-Datenformat");
  }

  const now = new Date();

  // Nur Vorstellungen in der Zukunft anzeigen.
  // Ungültige oder nicht erkannte Termine werden ausgelassen.
  const events = Object.entries(data)
    .map(([key, value]) => parseEvent(key, value))
    .filter(event =>
      event.dateValue !== null &&
      event.dateValue.getTime() > now.getTime()
    )
    .sort((a, b) =>
      a.dateValue.getTime() - b.dateValue.getTime()
    );

  if (events.length === 0) {
    $("events").innerHTML = `
      <div class="empty">
        Aktuell sind keine kommenden Vorstellungen verfügbar.
      </div>
    `;
    return;
  }

  $("events").innerHTML = events.map(event => {
    const cap = CAPACITY > 0 ? CAPACITY : 0;

    const remaining = cap
      ? Math.max(0, cap - event.sold)
      : null;

    const pct = cap
      ? Math.min(100, Math.round(event.sold / cap * 100))
      : null;

    const warning = pct !== null && pct >= 75;

    let status;

    if (remaining === null) {
      status = "KAPAZITÄT UNBEKANNT";
    } else if (remaining === 0) {
      status = "AUSVERKAUFT";
    } else {
      status = `${remaining.toLocaleString("de-DE")} FREI`;
    }

    return `
      <article class="event">

        <div class="dateblock">
          <div class="date">${esc(event.dateLabel)}</div>
          <div class="small">${esc(event.timeLabel)} Uhr</div>
        </div>

        <div class="eventname">
          <div class="title">${esc(event.title)}</div>
          <div class="small">ID ${esc(event.id || "—")}</div>
        </div>

        <div class="sales">
          <div class="sold">
            ${event.sold.toLocaleString("de-DE")}
          </div>

          <div class="small">
            Tickets verkauft${cap ? " / " + cap : ""}
          </div>

          ${pct !== null ? `
            <div class="bar">
              <span
                class="${warning ? "warning" : ""}"
                style="width:${pct}%"
              ></span>
            </div>
            <div class="small">${pct}% verkauft</div>
          ` : ""}
        </div>

        <div class="statusblock">
          <span class="status ${warning ? "warning" : ""}">
            ${esc(status)}
          </span>

          <div class="small">
            ${remaining !== null
              ? remaining.toLocaleString("de-DE") + " verfügbar"
              : "Verfügbarkeit unbekannt"}
          </div>
        </div>

      </article>
    `;
  }).join("");
}

async function load() {
  if (isLoading) return;

  isLoading = true;

  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    render(data);

  } catch (error) {
    console.error("Fehler beim Laden der Vorstellungen:", error);

    // Bereits geladene Termine stehen bei Netzwerkfehlern
    // weiterhin auf der Seite.
    if (!$("events").querySelector(".event")) {
      $("events").innerHTML = `
        <div class="error">
          Die Vorstellungen konnten nicht geladen werden.
          Bitte überprüfe deine Internetverbindung.
        </div>
      `;
    }
  } finally {
    isLoading = false;
  }
}

// Beim Öffnen laden und danach alle fünf Minuten aktualisieren.
load();
setInterval(load, REFRESH_MS);
</script>

</body>
</html>
