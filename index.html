<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05090d">

<title>Theater Tickets</title>

<style>
:root {
  color-scheme: dark;
  --bg: #05090d;
  --card: #0a1119;
  --line: #233244;
  --muted: #8ca2ba;
  --text: #f1f6fc;
  --green: #00c781;
  --amber: #ffbf2f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px;
}

header {
  margin-bottom: 26px;
}

.brand {
  font-size: clamp(23px, 5vw, 30px);
  font-weight: 800;
  letter-spacing: -.04em;
}

.subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .13em;
}

#events {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.event {
  min-width: 0;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.event-top,
.event-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.date {
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .045em;
}

.time {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.title {
  margin: 13px 0 18px;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.event-bottom {
  flex-wrap: wrap;
  font-size: 12px;
}

.sold {
  color: var(--muted);
}

.remaining {
  color: var(--green);
  font-weight: 650;
}

.remaining.warning {
  color: var(--amber);
}

.remaining.full {
  color: #ff7272;
}

.bar {
  width: 100%;
  height: 4px;
  margin-top: 13px;
  overflow: hidden;
  background: var(--line);
  border-radius: 99px;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--green);
  border-radius: inherit;
}

.bar span.warning {
  background: var(--amber);
}

.bar span.full {
  background: #ff7272;
}

.empty,
.error {
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.error {
  color: var(--amber);
}

footer {
  padding: 20px 0 0;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

@media (max-width: 480px) {
  main {
    padding: 24px 14px;
  }

  header {
    margin-bottom: 20px;
  }

  .event {
    padding: 15px;
    border-radius: 10px;
  }

  .title {
    font-size: 17px;
    margin: 12px 0 16px;
  }

  .event-bottom {
    font-size: 11px;
    gap: 8px;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <div class="brand">THEATER TICKETS</div>
    <div class="subtitle">KOMMENDE VORSTELLUNGEN</div>
  </header>

  <section id="events" aria-live="polite">
    <div class="empty">Vorstellungen werden geladen …</div>
  </section>

  <footer>Automatische Aktualisierung alle 5 Minuten</footer>
</main>

<script>
"use strict";

const DATA_URL =
  "https://raw.githubusercontent.com/TNNSLAB/termine/main/state.json";

const REFRESH_MS = 5 * 60 * 1000;
const CAPACITY = 150;

const $ = id => document.getElementById(id);
const MONTHS = {
  jan: 0, januar: 0,
  feb: 1, februar: 1,
  mär: 2, märz: 2, mrz: 2,
  apr: 3, april: 3,
  mai: 4,
  jun: 5, juni: 5,
  jul: 6, juli: 6,
  aug: 7, august: 7,
  sep: 8, sept: 8, september: 8,
  okt: 9, oktober: 9,
  nov: 10, november: 10,
  dez: 11, dezember: 11
};

let isLoading = false;

function parseEvent(key, sold) {
  const idMatch = key.match(/^(\d+)-(.+)$/);
  const id = idMatch ? idMatch[1] : "";
  const rawTitle = idMatch ? idMatch[2] : key;

  const pattern =
    /^(.*?)\s+(?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*(\d{1,2})\.\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*Uhr$/i;

  const m = rawTitle.trim().match(pattern);

  let title = rawTitle;
  let dateLabel = "";
  let dateValue = null;
  let timeLabel = "";

  if (m) {
    title = m[1].trim();

    const day = Number(m[2]);
    const monthName = m[3]
      .replace(/\.$/, "")
      .toLocaleLowerCase("de-DE");

    const year = Number(m[4]);
    const hours = Number(m[5]);
    const minutes = Number(m[6]);
    const month = MONTHS[monthName];

    const labelMatch = rawTitle.match(
      /((?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*\d{1,2}\.\s+[A-Za-zÄÖÜäöü]+\.?\s+\d{4})/i
    );

    if (labelMatch) {
      dateLabel = labelMatch[1].trim();
    }

    timeLabel =
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0");

    if (
      month !== undefined &&
      day >= 1 && day <= 31 &&
      hours >= 0 && hours <= 23 &&
      minutes >= 0 && minutes <= 59
    ) {
      const parsed = new Date(
        year, month, day, hours, minutes
      );

      if (
        parsed.getFullYear() === year &&
        parsed.getMonth() === month &&
        parsed.getDate() === day
      ) {
        dateValue = parsed;
      }
    }
  }

  const n = Number(sold);

  return {
    id,
    title,
    dateLabel,
    timeLabel,
    dateValue,
    sold: Number.isFinite(n) ? Math.max(0, n) : 0
  };
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function render(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw new Error("Ungültiges Datenformat");
  }

  const now = new Date();

  const events = Object.entries(data)
    .map(([key, value]) => parseEvent(key, value))
    .filter(event =>
      event.dateValue !== null &&
      event.dateValue.getTime() > now.getTime()
    )
    .sort((a, b) => a.dateValue - b.dateValue);

  if (!events.length) {
    $("events").innerHTML = `
      <div class="empty">
        Aktuell sind keine kommenden Vorstellungen verfügbar.
      </div>
    `;
    return;
  }

  $("events").innerHTML = events.map(event => {
    const remaining = CAPACITY > 0
      ? Math.max(0, CAPACITY - event.sold)
      : null;

    const pct = CAPACITY > 0
      ? Math.min(100, Math.round(event.sold / CAPACITY * 100))
      : null;

    const full = remaining === 0;
    const warning = pct !== null && pct >= 75;
    const stateClass = full ? "full" : warning ? "warning" : "";

    let availability = "Kapazität unbekannt";

    if (remaining !== null) {
      availability = full
        ? "Ausverkauft"
        : `${remaining.toLocaleString("de-DE")} verfügbar`;
    }

    return `
      <article class="event">
        <div class="event-top">
          <div class="date">${esc(event.dateLabel || "Termin")}</div>
          <div class="time">${esc(event.timeLabel)} Uhr</div>
        </div>

        <div class="title">${esc(event.title)}</div>

        <div class="event-bottom">
          <div class="sold">
            Verkauft: ${event.sold.toLocaleString("de-DE")}${CAPACITY > 0 ? " / " + CAPACITY : ""}
          </div>

          <div class="remaining ${stateClass}">
            ${esc(availability)}
          </div>
        </div>

        ${pct !== null ? `
          <div
            class="bar"
            role="progressbar"
            aria-label="Verkaufsfortschritt"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="${pct}"
          >
            <span
              class="${stateClass}"
              style="width:${pct}%"
            ></span>
          </div>
        ` : ""}
      </article>
    `;
  }).join("");
}

async function load() {
  if (isLoading) return;
  isLoading = true;

  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    render(data);

  } catch (error) {
    console.error("Fehler beim Laden:", error);

    if (!$("events").querySelector(".event")) {
      $("events").innerHTML = `
        <div class="error">
          Vorstellungen konnten nicht geladen werden.
          Bitte Internetverbindung prüfen.
        </div>
      `;
    }
  } finally {
    isLoading = false;
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
