<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05090d">

<title>Theater Tickets</title>

<style>
:root {
  color-scheme: dark;
  --bg: #05090d;
  --card: #0a1119;
  --panel: #111e2a;
  --line: #233244;
  --muted: #8ca2ba;
  --text: #f1f6fc;
  --green: #00c781;
  --amber: #ffbf2f;
  --red: #ff7272;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 36px 20px;
}

header {
  margin-bottom: 25px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.brand {
  font-size: clamp(23px, 5vw, 30px);
  font-weight: 800;
  letter-spacing: -.04em;
}

.subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .13em;
}

.live {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--green);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .08em;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(0, 199, 129, .45);
}

/* EVENTS */

#events {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

/* FEATURED EVENT */

.event-featured {
  padding: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
}

.event-label {
  color: var(--green);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .07em;
  line-height: 1.6;
}

.event-title {
  margin: 12px 0 20px;
  font-size: 25px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -.035em;
  overflow-wrap: anywhere;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  min-width: 0;
  padding: 15px;
  background: var(--panel);
  border-radius: 11px;
}

.stat-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
}

.stat-value {
  margin-top: 5px;
  color: var(--text);
  font-size: 32px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -.05em;
  font-variant-numeric: tabular-nums;
}

.stat-value.green {
  color: var(--green);
}

.stat-subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 17px;
  color: var(--muted);
  font-size: 11px;
}

.progress-info strong {
  color: var(--text);
  font-weight: 700;
}

.bar {
  width: 100%;
  height: 7px;
  margin-top: 8px;
  overflow: hidden;
  background: var(--line);
  border-radius: 99px;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--green);
  border-radius: inherit;
}

.bar span.warning {
  background: var(--amber);
}

.bar span.full {
  background: var(--red);
}

/* UPCOMING EVENT */

.upcoming-heading {
  margin: 4px 0 -3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .12em;
}

.event-small {
  padding: 17px 19px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
}

.small-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.small-date {
  color: var(--green);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .04em;
}

.small-time {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.small-title {
  margin: 9px 0 13px;
  font-size: 17px;
  font-weight: 750;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.small-stats {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}

.small-sold {
  color: var(--text);
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.small-sold span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
}

.small-remaining {
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
  text-align: right;
}

.small-remaining.warning {
  color: var(--amber);
}

.small-remaining.full {
  color: var(--red);
}

.small-bar {
  height: 4px;
  margin-top: 12px;
  overflow: hidden;
  background: var(--line);
  border-radius: 99px;
}

.small-bar span {
  display: block;
  height: 100%;
  background: var(--green);
  border-radius: inherit;
}

.small-bar span.warning {
  background: var(--amber);
}

.small-bar span.full {
  background: var(--red);
}

/* EMPTY / ERROR */

.empty,
.error {
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.error {
  color: var(--amber);
}

/* MOBILE */

@media (max-width: 480px) {
  main {
    padding: 25px 14px;
  }

  header {
    margin-bottom: 20px;
  }

  .event-featured {
    padding: 18px;
  }

  .event-title {
    font-size: 22px;
    margin: 11px 0 17px;
  }

  .stat {
    padding: 12px;
  }

  .stat-value {
    font-size: 28px;
  }

  .event-small {
    padding: 15px;
  }

  .small-title {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<main>

  <header>
    <div class="header-top">
      <div class="brand">THEATER TICKETS</div>

    <div class="subtitle">KOMMENDE VORSTELLUNGEN</div>
  </header>

  <section id="events" aria-live="polite">
    <div class="empty">Vorstellungen werden geladen …</div>
  </section>

</main>

<script>
"use strict";

const DATA_URL =
  "https://raw.githubusercontent.com/TNNSLAB/termine/main/state.json";

const CAPACITY = 150;
const MAX_EVENTS = 2;

const $ = id => document.getElementById(id);

const MONTHS = {
  jan: 0, januar: 0,
  feb: 1, februar: 1,
  mär: 2, märz: 2, mrz: 2,
  apr: 3, april: 3,
  mai: 4,
  jun: 5, juni: 5,
  jul: 6, juli: 6,
  aug: 7, august: 7,
  sep: 8, sept: 8, september: 8,
  okt: 9, oktober: 9,
  nov: 10, november: 10,
  dez: 11, dezember: 11
};


let isLoading = false;


/* PARSE EVENT */

function parseEvent(key, sold) {
  const idMatch = key.match(/^(\d+)-(.+)$/);
  const id = idMatch ? idMatch[1] : "";
  const rawTitle = idMatch ? idMatch[2] : key;

  const pattern =
    /^(.*?)\s+(?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*(\d{1,2})\.\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*Uhr$/i;

  const m = rawTitle.trim().match(pattern);

  let title = rawTitle;
  let dateLabel = "";
  let dateValue = null;
  let timeLabel = "";

  if (m) {
    title = m[1].trim();

    const day = Number(m[2]);

    const monthName = m[3]
      .replace(/\.$/, "")
      .toLocaleLowerCase("de-DE");

    const year = Number(m[4]);
    const hours = Number(m[5]);
    const minutes = Number(m[6]);
    const month = MONTHS[monthName];

    const labelMatch = rawTitle.match(
      /((?:Mo|Di|Mi|Do|Fr|Sa|So)\.?,?\s*\d{1,2}\.\s+[A-Za-zÄÖÜäöü]+\.?\s+\d{4})/i
    );

    if (labelMatch) {
      dateLabel = labelMatch[1].trim();
    }

    timeLabel =
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0");

    if (
      month !== undefined &&
      day >= 1 && day <= 31 &&
      hours >= 0 && hours <= 23 &&
      minutes >= 0 && minutes <= 59
    ) {
      const parsed = new Date(
        year, month, day, hours, minutes
      );

      if (
        parsed.getFullYear() === year &&
        parsed.getMonth() === month &&
        parsed.getDate() === day
      ) {
        dateValue = parsed;
      }
    }
  }

  const n = Number(sold);

  return {
    id,
    title,
    dateLabel,
    timeLabel,
    dateValue,
    sold: Number.isFinite(n) ? Math.max(0, n) : 0
  };
}


/* HTML ESCAPING */

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}


/* EVENT STATISTICS */

function getStats(event) {
  const remaining = CAPACITY > 0
    ? Math.max(0, CAPACITY - event.sold)
    : null;

  const pct = CAPACITY > 0
    ? Math.min(100, Math.round(event.sold / CAPACITY * 100))
    : null;

  const full = remaining === 0;
  const warning = pct !== null && pct >= 75;

  const stateClass = full
    ? "full"
    : warning
      ? "warning"
      : "";

  return {
    remaining,
    pct,
    stateClass
  };
}


/* FEATURED EVENT HTML */

function renderFeatured(event) {
  const stats = getStats(event);

  const availability = stats.remaining === null
    ? "Unbekannt"
    : stats.remaining === 0
      ? "Ausverkauft"
      : stats.remaining.toLocaleString("de-DE");

  return `
    <article class="event-featured">

      <div class="event-label">
        NÄCHSTE VORSTELLUNG ·
        ${esc(event.dateLabel || "Termin")}
        · ${esc(event.timeLabel)} UHR
      </div>

      <div class="event-title">
        ${esc(event.title)}
      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-label">VERKAUFT</div>

          <div class="stat-value">
            ${event.sold.toLocaleString("de-DE")}
          </div>

          <div class="stat-subtitle">
            ${CAPACITY > 0 ? `von ${CAPACITY} Tickets` : "Tickets"}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">VERFÜGBAR</div>

          <div class="stat-value green">
            ${availability}
          </div>

          <div class="stat-subtitle">
            ${stats.remaining === null ? "Kapazität unbekannt" : "Tickets"}
          </div>
        </div>

      </div>

      ${stats.pct !== null ? `
        <div class="progress-info">
          <span>Verkaufsfortschritt</span>
          <strong>${stats.pct}%</strong>
        </div>

        <div
          class="bar"
          role="progressbar"
          aria-label="Verkaufsfortschritt"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="${stats.pct}"
        >
          <span
            class="${stats.stateClass}"
            style="width:${stats.pct}%"
          ></span>
        </div>
      ` : ""}

    </article>
  `;
}


/* SMALL UPCOMING EVENT HTML */

function renderSmall(event) {
  const stats = getStats(event);

  const availability = stats.remaining === null
    ? "Unbekannt"
    : stats.remaining === 0
      ? "Ausverkauft"
      : `${stats.remaining.toLocaleString("de-DE")} verfügbar`;

  return `
    <article class="event-small">

      <div class="small-top">
        <div class="small-date">
          ${esc(event.dateLabel || "Termin")}
        </div>

        <div class="small-time">
          ${esc(event.timeLabel)} Uhr
        </div>
      </div>

      <div class="small-title">
        ${esc(event.title)}
      </div>

      <div class="small-stats">

        <div class="small-sold">
          ${event.sold.toLocaleString("de-DE")}
          <span>VERKAUFT</span>
          ${CAPACITY > 0 ? `<span>/ ${CAPACITY}</span>` : ""}
        </div>

        <div class="small-remaining ${stats.stateClass}">
          ${esc(availability)}
        </div>

      </div>

      ${stats.pct !== null ? `
        <div class="small-bar">
          <span
            class="${stats.stateClass}"
            style="width:${stats.pct}%"
          ></span>
        </div>
      ` : ""}

    </article>
  `;
}


/* RENDER EVENTS */

function render(data) {
  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {
    throw new Error("Ungültiges Datenformat");
  }

  const now = new Date();

  const events = Object.entries(data)
    .map(([key, value]) => parseEvent(key, value))
    .filter(event =>
      event.dateValue !== null &&
      event.dateValue.getTime() > now.getTime()
    )
    .sort((a, b) => a.dateValue - b.dateValue)
    .slice(0, MAX_EVENTS);

  if (!events.length) {
    $("events").innerHTML = `
      <div class="empty">
        Aktuell sind keine kommenden Vorstellungen verfügbar.
      </div>
    `;
    return;
  }

  let html = "";

  // First event: large featured card.
  html += renderFeatured(events[0]);

  // Second event: compact upcoming preview.
  if (events.length > 1) {
    html += `
      <div class="upcoming-heading">
        KOMMENDE VORSTELLUNGEN
      </div>
    `;

    html += renderSmall(events[1]);
  }

  $("events").innerHTML = html;
}


/* LOAD JSON */

async function load() {
  if (isLoading) return;

  isLoading = true;

  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    render(data);

  } catch (error) {
    console.error("Fehler beim Laden:", error);

    if (!$("events").querySelector(".event-featured")) {
      $("events").innerHTML = `
        <div class="error">
          Vorstellungen konnten nicht geladen werden.
          Bitte Internetverbindung prüfen.
        </div>
      `;
    }

  } finally {
    isLoading = false;
  }
}

load();

</script>

</body>
</html>
